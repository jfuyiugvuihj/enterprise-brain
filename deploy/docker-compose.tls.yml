# R52 -- optional overlay: serve the stack over an internal HTTPS origin.
#
# Nothing here is active unless you ask for it. Plain HTTP stays the default because a
# customer machine usually gets its certificate from its own CA after installation, and
# an image that hard-codes a certificate cannot be reused across tenants.
#
#   docker compose --env-file deploy/.env.server \
#     -f docker-compose.yml -f deploy/docker-compose.tls.yml up -d --wait
#
# Requirements: TLS_CERT_FILE / TLS_KEY_FILE point at a fullchain and its key as issued
# by the customer CA; the browser origin must then be https://<internal-dns-name>, and
# CORS_ALLOW_ORIGINS in deploy/.env.server has to name exactly that origin. Clients that
# trust the CA automatically need no further setup; if they do not, import the CA root,
# never disable certificate verification (scripts/check_airgap_readiness.py fails on that).

services:
  frontend:
    ports:
      # Compose merges port lists, so :80 keeps working and answers 301 with the
# drop-in below.
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${TLS_NGINX_CONF:-deploy/nginx.https.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${TLS_CERT_FILE:?set TLS_CERT_FILE to the fullchain issued by your internal CA}
        target: /etc/ssl/brain/fullchain.pem
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?set TLS_KEY_FILE to the private key matching that certificate}
        target: /etc/ssl/brain/privkey.pem
        read_only: true
