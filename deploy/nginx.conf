# ============================================================
# 企业智脑 — Nginx 反向代理 (Layer 4)
# 支持: SSE 流式、WebSocket、静态文件、限流、负载均衡
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ——— 性能调优 ———
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ——— Gzip 压缩 ———
    gzip on;
    gzip_min_length 512;
    gzip_types text/plain application/json text/event-stream text/css application/javascript;

    # ——— 上游 uvicorn 集群（8 实例，支撑 1000+ 并发）———
    upstream enterprise_brain {
        least_conn;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8005 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8006 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8007 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8008 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ——— 限流区域 (Layer 5 配合使用) ———
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ——— HTTP → HTTPS 重定向 (生产环境启用) ———
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # server_name your-domain.com;  # 生产环境改为实际域名

        # 连接数限制
        limit_conn conn_limit 20;

        # ——— 静态文件（图表/导出） ———
        location /static/ {
            alias /path/to/企业智脑/static/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # ——— 前端 (Vue 生产构建) ———
        location / {
            root /path/to/企业智脑/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ——— API 反向代理 (SSE 流式需特殊处理) ———
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://enterprise_brain;
            proxy_http_version 1.1;

            # SSE 长连接必须的配置
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 透传客户端信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ——— 健康检查 ———
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # ——— HTTPS (生产环境启用) ———
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     ... 同上 location 配置 ...
    # }
}
