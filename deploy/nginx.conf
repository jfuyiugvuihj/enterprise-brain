# ============================================================
# 企业智脑 — 容器边缘代理（/etc/nginx/conf.d/default.conf 片段）
#
# 这里是 conf.d 片段，不能再包含 worker_processes / events / http，
# 否则 nginx 会与内置的 /etc/nginx/nginx.conf 冲突，`nginx -t` 直接失败。
#
# 生成的图表与报告只能通过 /api/v1/artifacts/{id}/... 走鉴权路由，
# 因此这里不存在任何公开的 /static 交付路径。
# ============================================================

# Both directives are valid here because conf.d files are included inside the
# image's http block.
limit_conn_zone $binary_remote_addr zone=conn_limit_api:10m;

# nginx resolves the host names inside an `upstream` block once, when the configuration is
# loaded, and never afterwards. The backend is a container, so a restart, an upgrade or a
# recreate hands out a new address, and every proxied request then answers 502 until this
# proxy is recreated too. The container gate reproduced exactly that: the backend image
# changed, the frontend container did not, and /api/v1/health through the proxy died while
# the same request straight to the backend stayed 200.
#
# So the target lives in a variable and Docker's embedded DNS is consulted per lookup: nginx
# re-resolves within the validity window instead of freezing one address at boot. A variable
# also means there is no upstream block, so least_conn and keepalive 32 are gone -- with a
# single backend on one Docker network they bought nothing, while a stale-address 502 takes
# the whole site down. ipv6=off because the compose network gives the backend an A record.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The compose service name, not a loopback port: see the resolver note above. A variable
    # in proxy_pass is what makes nginx look the name up again after the backend moves.
    set $enterprise_brain_api http://backend:8001;

    # 与后端 DOCUMENT_UPLOAD_MAX_BYTES（默认 25 MiB）保持有余量的一致：
    # 让客户端看到应用给出的超限说明，而不是 nginx 的裸 413。
    client_max_body_size 30m;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain application/json text/css application/javascript;

    # SSE 需要长连接与关闭缓冲；队列状态每 3 秒轮询，因此不设置请求级限流，
    # 只限制并发连接，避免把正常的前端轮询误判成攻击。
    location /api/ {
        limit_conn conn_limit_api 200;

        proxy_pass $enterprise_brain_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 真实健康检查必须落到后端，不能由代理自己回答 200。
    location = /api/v1/health {
        proxy_pass $enterprise_brain_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # 运行时目录不在镜像里，任何情况下都不通过边缘代理暴露。
    location ~* ^/(documents|data|logs|chroma_db|static|uploads|exports)/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}